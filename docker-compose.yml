services:
  health-ingest:
    build: .
    restart: unless-stopped
    volumes:
      - ./config.yaml:/app/config.yaml:ro
      - ./data:/data
    networks:
      - proxy

networks:
  proxy:
    external: true
    # 改成反向代理容器所在的网络名。查看方式：
    #   docker inspect <反代容器名> --format '{{range $k,$v := .NetworkSettings.Networks}}{{$k}}{{"\n"}}{{end}}'
    name: proxy_net

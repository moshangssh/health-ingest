# 复制为 config.yaml 后按需修改（config.yaml 不入库）
# cp config.example.yaml config.yaml

# 监听地址。端口需与 docker-compose.yml 的端口映射一致
listen: "0.0.0.0:18117"

# 数据目录。docker-compose 将宿主 ./data 挂载到 /data
data_dir: "/data"

# HC Webhook 请求头 x-api-key 的值。改成你自己的随机串，
# 两处必须一致：此处 + 手机 HC Webhook 的自定义请求头
ingest_key: "change-me-to-a-random-string"
